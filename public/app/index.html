    <style id="expo-reset">
      /* Lock outer document on iOS PWA to prevent rubber-band scrolling and WebKit's progressive status-bar blur */
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        inset: 0;
        -webkit-overflow-scrolling: touch;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        flex: 1;
        background-color: #FFFFFF;
        overflow: hidden;
      }
      /* Prevent iOS 18+/26 WebKit from attaching its progressive blur pocket to top-level ScrollViews */
      #root::before {
        content: "";
        display: block;
        width: 100%;
        height: 2px;
        flex: 0 0 2px;
        background-color: #FFFFFF;
        z-index: 9999;
      }
      /* Remove browser default focus outline box inside custom RNW TextInput wrappers */
      input, textarea, select, [contenteditable] {
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
      }
      input:focus, input:focus-visible, textarea:focus, textarea:focus-visible, select:focus, select:focus-visible {
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
      }
      /* Smooth PWA slide-up transitions for modals & sheets */
      @keyframes bookoraBackdropFade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes bookoraSheetSlideUp {
        from {
          opacity: 0;
          transform: translate3d(0, 32px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }
      div[aria-modal="true"][role="dialog"] {
        animation: bookoraBackdropFade 200ms ease-out;
      }
      div[aria-modal="true"][role="dialog"] > div > div > :last-child {
        animation: bookoraSheetSlideUp 260ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: transform, opacity;
      }
